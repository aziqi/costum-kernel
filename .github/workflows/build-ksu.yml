name: Build KernelSU-Next for a9y18qlte

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y build-essential crossbuild-essential-arm64 bc bison flex libssl-dev python3 python2 zip unzip curl git sudo gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 --branch CAF https://github.com/thongass000/android_kernel_samsung_a9y18qlte kernel_a9

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Integrate KernelSU-Next (Legacy Non-GKI)
        shell: /bin/bash -eo pipefail {0}
        run: |
          cd kernel_a9

          # 1. Clone KernelSU-Next (branch next) — official non-GKI source
          git clone --depth=1 --branch next https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next

          # 2. Wire the driver into the kernel tree (symlink + Kconfig/Makefile)
          cd drivers
          ln -sf ../../KernelSU-Next/kernel kernelsu
          cd ..
          grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # 3. Defconfig: disable kprobes (forces MANUAL_HOOK), enable KSU
          DEF=arch/arm64/configs/a9y18qlte_defconfig
          sed -i 's/^CONFIG_HAVE_KPROBES=y/# CONFIG_HAVE_KPROBES is not set/' "$DEF"
          grep -q '^# CONFIG_KPROBE_EVENTS is not set' "$DEF" || echo "# CONFIG_KPROBE_EVENTS is not set" >> "$DEF"
          grep -q '^CONFIG_KSU=y' "$DEF" || echo "CONFIG_KSU=y" >> "$DEF"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$DEF" || echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEF"

      - name: Inject KernelSU-Next Manual Hooks
        shell: /bin/bash -eo pipefail {0}
        run: |
          cd kernel_a9
          python3 "${GITHUB_WORKSPACE}/scripts/inject-ksu-hooks.py"

          # Verify all five hooks are present before building
          for sym in ksu_handle_execveat ksu_handle_faccessat ksu_handle_sys_read ksu_handle_stat ksu_handle_sys_reboot; do
            grep -rq "$sym" fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c \
              || { echo "HOOK MISSING: $sym"; exit 1; }
          done
          echo "All KSU manual hooks present."

      - name: Patch gcc-wrapper.py for GCC9 Compatibility
        shell: /bin/bash -eo pipefail {0}
        run: |
          sed -i 's|CC\t\t= $(PYTHON) $(srctree)/scripts/gcc-wrapper.py $(REAL_CC)|CC\t\t= $(REAL_CC)|' \
            kernel_a9/Makefile
          echo "Makefile patch verification:"
          grep -n "REAL_CC\|gcc-wrapper" kernel_a9/Makefile | head -5

      - name: Build Kernel
        shell: /bin/bash -eo pipefail {0}
        run: |
          cd kernel_a9
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out a9y18qlte_defconfig PYTHON=python2
          make O=out -j$(nproc) Image.gz-dtb PYTHON=python2 2>&1 | tee build.log

      - name: Package AnyKernel3
        shell: /usr/bin/bash -e {0}
        run: |
          mkdir ak3
          if [ -f "thongass000-v4.4.205-stable.zip" ]; then
            unzip -q thongass000-v4.4.205-stable.zip -d ak3/
            if [ -f "kernel_a9/out/arch/arm64/boot/Image.gz-dtb" ]; then
              KERNEL_IMAGE="kernel_a9/out/arch/arm64/boot/Image.gz-dtb"
            elif [ -f "kernel_a9/out/arch/arm64/boot/Image.gz" ]; then
              KERNEL_IMAGE="kernel_a9/out/arch/arm64/boot/Image.gz"
            elif [ -f "kernel_a9/out/arch/arm64/boot/Image" ]; then
              KERNEL_IMAGE="kernel_a9/out/arch/arm64/boot/Image"
            else
              echo "ERROR: Compiled kernel image tidak ditemukan!"
              exit 1
            fi
            cp $KERNEL_IMAGE ak3/
            sed -i 's/kernel.string=.*/kernel.string=KernelSU-Next @ a9y18qlte by @thongass000/g' ak3/anykernel.sh
            cd ak3
            zip -r9 ../a9y18qlte-KSUN.zip * -x .git
          else
            echo "ERROR: thongass000-v4.4.205-stable.zip not found! Uploading raw image instead."
            if [ -f "kernel_a9/out/arch/arm64/boot/Image.gz-dtb" ]; then cp kernel_a9/out/arch/arm64/boot/Image.gz-dtb a9y18qlte-KSUN.zip; else cp kernel_a9/out/arch/arm64/boot/Image* a9y18qlte-KSUN.zip || true; fi
          fi

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Log
          path: kernel_a9/build.log

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: a9y18qlte-KSUN-Zip
          path: a9y18qlte-KSUN.zip
